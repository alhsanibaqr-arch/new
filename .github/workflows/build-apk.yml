name: Build Android app
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run unit and emulator UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            for attempt in $(seq 1 30); do
              if adb shell service check package | grep -q found; then
                break
              fi
              sleep 5
            done
            adb shell service check package | grep -q found || { echo "Android package service did not become ready"; exit 1; }
            gradle --no-daemon testDebugUnitTest connectedDebugAndroidTest
      - name: Run Android lint and build packages
        run: gradle --no-daemon lintDebug assembleDebug bundleRelease
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: vardely-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: vardely-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
